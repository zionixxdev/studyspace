<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudySpace — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b1020; color: #e5e7eb; text-align: center; padding: 2rem;
      }
      .card { max-width: 26rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { color: #9ca3af; line-height: 1.6; }
      a { color: #a5b4fc; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        StudySpace needs a connection for messages, files and shared study rooms.
        Cached pages still open, but anything server-backed is unavailable until
        you reconnect — we won't pretend it synced.
      </p>
      <p><a href="/">Try again</a></p>
    </div>
  </body>
</html>
