name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # NOTE: `npm ci` needs a committed lockfile. Generate one by running
      # `npm install` locally and committing package-lock.json, then switch this
      # to `npm ci` for faster, reproducible installs.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (all workspaces)
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests (shared + api + web)
        run: npm test

      - name: Build (shared, api, web)
        run: npm run build
        env:
          # Placeholders so the web build's env validation passes in CI.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000000000
          VITE_API_BASE_URL: /api/v1

  sql-check:
    # Cheap, reliable syntax validation of the migrations. The full RLS suite
    # (`supabase test db`, which needs Docker and a local stack) is documented
    # in docs/SETUP.md and should be run before deploying schema changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQL parser
        run: pip install pglast

      - name: Validate every migration parses as PostgreSQL
        run: |
          python - <<'PY'
          import glob, sys
          import pglast
          ok = True
          for f in sorted(glob.glob('supabase/migrations/*.sql')) + sorted(glob.glob('supabase/tests/*.sql')):
              try:
                  pglast.parse_sql(open(f).read())
                  print(f'OK   {f}')
              except Exception as e:
                  ok = False
                  print(f'FAIL {f}: {e}')
          sys.exit(0 if ok else 1)
          PY
